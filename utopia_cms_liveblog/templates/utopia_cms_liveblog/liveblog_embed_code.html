{% if not disable_iframe_resizer %}
  <style>
    #liveblog-iframe {
      width: 1px;
      min-width: 100%;
    }
  </style>
  <script src="//cdn.jsdelivr.net/npm/iframe-resizer/js/iframeResizer.min.js"></script>
{% endif %}
<script src="{{ object.environment.url }}/embed.js" defer></script>
{% spaceless %}
  <iframe {% if allowAttrs %}allow="{{ allowAttrs }}"{% endif %} src="{{ object.url }}{% if query_params_str %}?{{query_params_str}}{% endif %}" frameborder="0" allowfullscreen
          {% if disable_iframe_resizer %}width="100%" height="400"
          {% else %}onload="iframeResize({log: false, license: 'GPLv3'}, '#liveblog-iframe');"{% endif %}
          id="liveblog-iframe"{% if is_frontpage %} class="liveblog-frontpage"{% endif %} title="Línea de tiempo de la cobertura en vivo">
  </iframe>
{% endspaceless %}
